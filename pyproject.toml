[project]
name = "depdelta-cli"
version = "0.2.0"
description = "DepDelta for CI: review a change's dependency updates on Gerrit, GitLab, Forgejo or Gitea."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Mbuodile Obiosio" }]
requires-python = ">=3.11"
dependencies = []
keywords = [
    "dependencies",
    "gerrit",
    "gitlab",
    "forgejo",
    "gitea",
    "codeberg",
    "ci",
    "renovate",
    "breaking-changes",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Homepage = "https://depdelta.com"
Documentation = "https://depdelta.com/ci"
Source = "https://github.com/mbobiosio/depdelta-cli"
Issues = "https://github.com/mbobiosio/depdelta-cli/issues"

[project.scripts]
depdelta = "depdelta_cli.main:main"

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/depdelta_cli"]

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.10",
]

[tool.pyright]
include = ["src"]
pythonVersion = "3.11"
venvPath = "."
venv = ".venv"
typeCheckingMode = "standard"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
python_files = ["test_*.py"]
addopts = "--cov=depdelta_cli --cov-report=term-missing --cov-fail-under=100"

[tool.coverage.run]
branch = true
omit = ["*/depdelta_cli/__main__.py"]

[tool.ruff]
line-length = 88

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
