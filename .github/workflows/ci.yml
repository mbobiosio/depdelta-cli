name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Lint, types & tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
      - name: Sync dependencies
        run: uv sync --frozen --python ${{ matrix.python }}
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format check
        run: uv run ruff format --check .
      - name: Type check (pyright)
        run: uv run pyright
      - name: Tests (100% coverage)
        run: uv run pytest

  image:
    name: Docker image builds
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: docker build -t depdelta-cli:ci .
      - name: Smoke test
        run: docker run --rm depdelta-cli:ci depdelta --version
