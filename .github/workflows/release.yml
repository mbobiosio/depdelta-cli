# On a version tag (v0.1.0): the package to PyPI (trusted publishing, no
# token) and the image to ghcr.io/mbobiosio/depdelta-cli.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  check:
    name: Tag matches the version
    # Releases publish from GitHub only; the Forgejo mirror runs this file too.
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Compare
        run: |
          VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml | head -1)
          test "v$VERSION" = "$GITHUB_REF_NAME" \
            || { echo "Tag $GITHUB_REF_NAME but pyproject says $VERSION"; exit 1; }

  pypi:
    name: PyPI
    runs-on: ubuntu-latest
    needs: check
    environment:
      name: pypi
      url: https://pypi.org/p/depdelta-cli
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
      - name: Build
        run: uv build
      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1

  image:
    name: GHCR image
    runs-on: ubuntu-latest
    needs: check
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/mbobiosio/depdelta-cli
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          labels: |
            org.opencontainers.image.licenses=MIT
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
